{{ define "main" }}
<section class="container-wide py-24 lg:py-32">
  <div class="mx-auto max-w-xl text-center">
    <p class="font-mono text-sm uppercase tracking-widest text-copper-700 dark:text-copper-400">404</p>
    <h1 class="mt-4 text-balance text-4xl font-semibold tracking-tight text-ink-900 sm:text-5xl dark:text-white">That page doesn't exist.</h1>
    <p class="mt-4 text-lg text-ink-600 dark:text-ink-300">It may have moved. Each product's docs now live under its own path, such as <a class="underline" href="/attackmap/">/attackmap/</a>. Try search.</p>
    <div class="mt-8 flex justify-center gap-3">
      <a href="/" class="btn btn-primary">Docs home</a>
      <button type="button" data-search-trigger class="btn btn-ghost">Search</button>
    </div>
  </div>
</section>
{{ end }}
